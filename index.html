<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Banco Santander</title>
</head>
<body>

    <div style="max-width: 800px; margin: 40px auto; font-family: sans-serif; text-align: center;">
        <h2 style="color: #333;">Evaluador de Crédito PYME</h2>
        <p style="color: #666; margin-bottom: 30px;">Arrastra los 6 estados de cuenta de los últimos meses para evaluar la viabilidad del cliente.</p>

        <div id="drop-zone" style="border: 3px dashed #EC0000; padding: 60px 20px; border-radius: 12px; background-color: #f9f9f9; transition: all 0.3s ease;">
            <h3 id="drop-text" style="color: #555; margin: 0;">📁 Suelta tus 6 archivos PDF aquí...</h3>
        </div>

        <div id="resultado" style="margin-top: 30px; padding: 25px; display: none; border-radius: 8px; border: 1px solid #ccc;"></div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const dropText = document.getElementById('drop-text');
        const resultado = document.getElementById('resultado');

        // 1. Mock de datos simulando la extracción de los 6 PDFs
        const estadosDeCuentaMock = [
            { mes: 'Mes 1', ingresos: 45000, egresos: 30000 },
            { mes: 'Mes 2', ingresos: 48000, egresos: 32000 },
            { mes: 'Mes 3', ingresos: 42000, egresos: 29000 },
            { mes: 'Mes 4', ingresos: 50000, egresos: 35000 },
            { mes: 'Mes 5', ingresos: 47000, egresos: 31000 },
            { mes: 'Mes 6', ingresos: 46000, egresos: 33000 }
        ];

        // 2. Lógica de evaluación financiera optimizada
        const evaluarViabilidad = (datos) => {
            const totales = datos.reduce((acc, mes) => {
                acc.ingresos += mes.ingresos;
                acc.egresos += mes.egresos;
                return acc;
            }, { ingresos: 0, egresos: 0 });

            const porcentajeGasto = (totales.egresos / totales.ingresos) * 100;
            const esViable = porcentajeGasto <= 70; // Regla de negocio: Max 70% de endeudamiento

            return {
                porcentaje: porcentajeGasto.toFixed(1),
                viable: esViable,
                ...totales // Spread operator para pasar los ingresos y egresos
            };
        };

        // 3. Eventos visuales de la zona de arrastre
        ['dragenter', 'dragover'].forEach(evento => {
            dropZone.addEventListener(evento, (e) => {
                e.preventDefault();
                dropZone.style.backgroundColor = '#ffe6e6';
                dropZone.style.borderColor = '#cc0000';
            });
        });

        ['dragleave', 'drop'].forEach(evento => {
            dropZone.addEventListener(evento, (e) => {
                e.preventDefault();
                dropZone.style.backgroundColor = '#f9f9f9';
                dropZone.style.borderColor = '#EC0000';
            });
        });

        // 4. Captura de archivos y ejecución del dictamen
        dropZone.addEventListener('drop', (e) => {
            const files = Array.from(e.dataTransfer.files);

            if (files.length !== 6) {
                alert(`⚠️ El protocolo exige 6 estados de cuenta. Has subido ${files.length}.`);
                return;
            }

            dropText.innerHTML = `✅ 6 archivos recibidos. <br><span style="font-size: 16px; color: #EC0000;">Extrayendo y procesando datos con el motor de riesgo... ⏳</span>`;
            
            // Simulamos el tiempo de lectura de los PDFs y ejecutamos el algoritmo
            setTimeout(() => {
                const dictamen = evaluarViabilidad(estadosDeCuentaMock);
                
                resultado.style.display = 'block';
                
                // Renderizado dinámico según el dictamen
                if(dictamen.viable) {
                    resultado.style.backgroundColor = '#e6ffe6';
                    resultado.style.borderColor = '#00cc00';
                    resultado.innerHTML = `
                        <h3 style="color: #00cc00;">✅ Crédito PYME Factible</h3>
                        <p><strong>Nivel de Endeudamiento:</strong> ${dictamen.porcentaje}% (Límite 70%)</p>
                        <p><strong>Ingresos Semestrales:</strong> $${dictamen.ingresos.toLocaleString()}</p>
                        <p><strong>Egresos Semestrales:</strong> $${dictamen.egresos.toLocaleString()}</p>
                        <hr style="border: 0; border-top: 1px solid #ccc; margin: 15px 0;">
                        <p style="font-size: 14px; color: #555;">Acción: Inicia la conversación en el chat de Salesforce para comunicar la aprobación al cliente.</p>
                    `;
                } else {
                    resultado.style.backgroundColor = '#ffe6e6';
                    resultado.style.borderColor = '#cc0000';
                    resultado.innerHTML = `
                        <h3 style="color: #cc0000;">⚠️ Riesgo Alto - Crédito Rechazado</h3>
                        <p><strong>Nivel de Endeudamiento:</strong> ${dictamen.porcentaje}% (Supera el límite del 70%)</p>
                        <p><strong>Ingresos Semestrales:</strong> $${dictamen.ingresos.toLocaleString()}</p>
                        <p><strong>Egresos Semestrales:</strong> $${dictamen.egresos.toLocaleString()}</p>
                        <hr style="border: 0; border-top: 1px solid #ccc; margin: 15px 0;">
                        <p style="font-size: 14px; color: #555;">Acción: Inicia la conversación en el chat de Salesforce para notificar la declinación.</p>
                    `;
                }
                
                // Reiniciamos la caja por si quieren subir más PDFs
                dropText.innerHTML = `📁 Soltar nuevos estados de cuenta...`;
            }, 2000); // 2 segundos de suspenso falso
        });
    </script>

    <script type='text/javascript'>
        function initEmbeddedMessaging() {
            try {
                embeddedservice_bootstrap.settings.language = 'es_MX'; // Corregido a es_MX

                embeddedservice_bootstrap.init(
                    '00Dg500000B7Kev',
                    'Chat_GitHub_PWA',
                    'https://orgfarm-b25ce7f3aa-dev-ed.develop.my.site.com/ESWChatGitHubPWA1780352056423',
                    {
                        scrt2URL: 'https://orgfarm-b25ce7f3aa-dev-ed.develop.my.salesforce-scrt.com'
                    }
                );
            } catch (err) {
                console.error('Error loading Embedded Messaging: ', err);
            }
        };
    </script>
    <script type='text/javascript' src='https://orgfarm-b25ce7f3aa-dev-ed.develop.my.site.com/ESWChatGitHubPWA1780352056423/assets/js/bootstrap.min.js' onload='initEmbeddedMessaging()'></script>

</body>
</html>
