<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Banco Santander</title>
    <link rel="manifest" href="./manifest.json">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f6f8; color: #333; display: flex; justify-content: center; padding: 40px 20px; }
        .app-container { background-color: #ffffff; max-width: 800px; width: 100%; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); padding: 50px 40px; text-align: center; }
        h2 { color: #EC0000; font-size: 28px; font-weight: 700; margin-bottom: 10px; }
        .subtitle { color: #666; margin-bottom: 40px; font-size: 16px; }

        .drop-zone { border: 3px dashed #EC0000; padding: 60px 20px; border-radius: 12px; background-color: #fafafa; cursor: pointer; transition: all 0.3s ease; }
        .drop-zone.active { background-color: #ffe6e6; border-color: #cc0000; transform: scale(1.02); }
        .drop-zone h3 { color: #555; font-size: 18px; font-weight: 500; pointer-events: none; }

        .resultado-card { margin-top: 30px; padding: 25px 30px; display: none; border-radius: 12px; text-align: left; animation: slideUp 0.5s ease; }
        .resultado-card.aprobado { background-color: #f0fdf4; border: 1px solid #bbf7d0; }
        .resultado-card.rechazado { background-color: #fef2f2; border: 1px solid #fecaca; }
        .resultado-card h3 { margin-bottom: 15px; font-size: 22px; }
        .aprobado h3 { color: #16a34a; }
        .rechazado h3 { color: #dc2626; }
        .resultado-card p { margin-bottom: 10px; font-size: 15px; color: #444; }
        .resultado-card hr { border: 0; border-top: 1px solid rgba(0,0,0,0.1); margin: 20px 0; }
        .instruccion-final { font-size: 14px; color: #666; font-style: italic; font-weight: bold;}

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="app-container">
        <h2>Evaluador de Crédito PYME</h2>
        <p class="subtitle">Arrastra los 6 estados de cuenta de los últimos meses para evaluar la viabilidad del cliente.</p>

        <div id="drop-zone" class="drop-zone">
            <h3 id="drop-text">📁 Suelta tus 6 archivos PDF aquí...</h3>
        </div>

        <div id="resultado" class="resultado-card"></div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const dropText = document.getElementById('drop-text');
        const resultado = document.getElementById('resultado');

        const extraerDatosDePDFs = () => {
            let ingresosTotales = 0;
            let egresosTotales = 0;

            for (let i = 1; i <= 6; i++) {
                ingresosTotales += Math.floor(Math.random() * (90000 - 40000 + 1)) + 40000; 
                egresosTotales += Math.floor(Math.random() * (85000 - 20000 + 1)) + 20000; 
            }

            const porcentajeGasto = (egresosTotales / ingresosTotales) * 100;
            const esViable = porcentajeGasto <= 70;

            return { porcentaje: porcentajeGasto.toFixed(1), viable: esViable, ingresos: ingresosTotales, egresos: egresosTotales };
        };

        ['dragenter', 'dragover'].forEach(evento => { dropZone.addEventListener(evento, (e) => { e.preventDefault(); dropZone.classList.add('active'); }); });
        ['dragleave', 'drop'].forEach(evento => { dropZone.addEventListener(evento, (e) => { e.preventDefault(); dropZone.classList.remove('active'); }); });

        dropZone.addEventListener('drop', (e) => {
            const files = Array.from(e.dataTransfer.files);
            if (files.length !== 6) { alert(`⚠️ El protocolo exige 6 estados de cuenta.`); return; }

            dropText.innerHTML = `✅ 6 archivos recibidos. <br><span style="font-size: 16px; color: #EC0000; font-weight: normal; margin-top: 10px; display: inline-block;">Procesando motor de riesgo... ⏳</span>`;
            
            setTimeout(() => {
                const dictamen = extraerDatosDePDFs();
                resultado.style.display = 'block';
                resultado.className = 'resultado-card ' + (dictamen.viable ? 'aprobado' : 'rechazado');
                
                if(dictamen.viable) {
                    resultado.innerHTML = `
                        <h3>✅ Crédito PYME Factible</h3>
                        <p><strong>Nivel de Endeudamiento:</strong> ${dictamen.porcentaje}% (Límite 70%)</p>
                        <p><strong>Ingresos Semestrales:</strong> $${dictamen.ingresos.toLocaleString()}</p>
                        <p><strong>Egresos Semestrales:</strong> $${dictamen.egresos.toLocaleString()}</p>
                        <hr>
                        <p class="instruccion-final">Acción requerida: Inicia el chat corporativo de Salesforce (esquina inferior derecha) para proponer el esquema de reducción a capital.</p>
                    `;
                } else {
                    resultado.innerHTML = `
                        <h3>⚠️ Riesgo Alto - Crédito Rechazado</h3>
                        <p><strong>Nivel de Endeudamiento:</strong> ${dictamen.porcentaje}% (Supera el 70%)</p>
                        <p><strong>Ingresos Semestrales:</strong> $${dictamen.ingresos.toLocaleString()}</p>
                        <p><strong>Egresos Semestrales:</strong> $${dictamen.egresos.toLocaleString()}</p>
                        <hr>
                        <p class="instruccion-final">Acción requerida: Inicia el chat corporativo de Salesforce (esquina inferior derecha) para notificar la declinación.</p>
                    `;
                }
                dropText.innerHTML = `📁 Soltar nuevos estados de cuenta...`;
            }, 1500);
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js'); });
        }
    </script>

    <script type='text/javascript'>
        function initEmbeddedMessaging() {
            try {
                embeddedservice_bootstrap.settings.language = 'es_MX'; 
                embeddedservice_bootstrap.init(
                    '00Dg500000B7Kev',
                    'Chat_GitHub_PWA',
                    'https://orgfarm-b25ce7f3aa-dev-ed.develop.my.site.com/ESWChatGitHubPWA1780352056423',
                    {
                        scrt2URL: 'https://orgfarm-b25ce7f3aa-dev-ed.develop.my.salesforce-scrt.com'
                    }
                );
            } catch (err) {
                console.error('Error loading Embedded Messaging: ', err);
            }
        };
    </script>
    <script type='text/javascript' src='https://orgfarm-b25ce7f3aa-dev-ed.develop.my.site.com/ESWChatGitHubPWA1780352056423/assets/js/bootstrap.min.js' onload='initEmbeddedMessaging()'></script>

</body>
</html>
