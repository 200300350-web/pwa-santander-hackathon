<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Banco Santander</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#EC0000">
</head>
<body>

    <div style="max-width: 800px; margin: 40px auto; font-family: sans-serif; text-align: center;">
        <h2 style="color: #333;">Evaluador de Crédito PYME</h2>
        <p style="color: #666; margin-bottom: 30px;">Arrastra los 6 estados de cuenta de los últimos meses para evaluar la viabilidad del cliente.</p>

        <div id="drop-zone" style="border: 3px dashed #EC0000; padding: 60px 20px; border-radius: 12px; background-color: #f9f9f9; transition: all 0.3s ease;">
            <h3 id="drop-text" style="color: #555; margin: 0;">📁 Suelta tus 6 archivos PDF aquí...</h3>
        </div>

        <div id="resultado" style="margin-top: 30px; padding: 25px; display: none; border-radius: 8px; border: 1px solid #ccc;"></div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const dropText = document.getElementById('drop-text');
        const resultado = document.getElementById('resultado');

        // 1. Motor Dinámico de Análisis (Simulación de lectura OCR de PDFs)
        const extraerDatosDePDFs = () => {
            let ingresosTotales = 0;
            let egresosTotales = 0;

            // Iteramos 6 veces simulando la extracción de los 6 documentos
            for (let i = 1; i <= 6; i++) {
                // Generamos ingresos entre $40,000 y $90,000 por mes
                const ingresosMensuales = Math.floor(Math.random() * (90000 - 40000 + 1)) + 40000; 
                // Generamos egresos entre $20,000 y $85,000 por mes (para forzar variabilidad de riesgo)
                const egresosMensuales = Math.floor(Math.random() * (85000 - 20000 + 1)) + 20000; 
                
                ingresosTotales += ingresosMensuales;
                egresosTotales += egresosMensuales;
            }

            // Calculamos la viabilidad financiera total
            const porcentajeGasto = (egresosTotales / ingresosTotales) * 100;
            const esViable = porcentajeGasto <= 70; // Límite estricto del 70%

            return {
                porcentaje: porcentajeGasto.toFixed(1),
                viable: esViable,
                ingresos: ingresosTotales,
                egresos: egresosTotales
            };
        };

        // 2. Eventos visuales de la zona de arrastre
        ['dragenter', 'dragover'].forEach(evento => {
            dropZone.addEventListener(evento, (e) => {
                e.preventDefault();
                dropZone.classList.add('active'); 
            });
        });

        ['dragleave', 'drop'].forEach(evento => {
            dropZone.addEventListener(evento, (e) => {
                e.preventDefault();
                dropZone.classList.remove('active'); 
            });
        });

        // 3. Captura de archivos y dictamen dinámico
        dropZone.addEventListener('drop', (e) => {
            const files = Array.from(e.dataTransfer.files);

            if (files.length !== 6) {
                alert(`⚠️ El protocolo exige 6 estados de cuenta. Has subido ${files.length}.`);
                return;
            }

            dropText.innerHTML = `✅ 6 archivos recibidos. <br><span style="font-size: 16px; color: #EC0000; font-weight: normal; margin-top: 10px; display: inline-block;">Extrayendo datos de los PDFs... ⏳</span>`;
            
            // Suspenso falso de 1.5 segundos para que parezca que la IA está procesando el texto
            setTimeout(() => {
                const dictamen = extraerDatosDePDFs(); // Ejecutamos el motor dinámico
                
                resultado.style.display = 'block';
                resultado.className = 'resultado-card ' + (dictamen.viable ? 'aprobado' : 'rechazado');
                
                if(dictamen.viable) {
                    resultado.innerHTML = `
                        <h3>✅ Crédito PYME Factible</h3>
                        <p><strong>Nivel de Endeudamiento:</strong> ${dictamen.porcentaje}% (Límite 70%)</p>
                        <p><strong>Ingresos Semestrales:</strong> $${dictamen.ingresos.toLocaleString()}</p>
                        <p><strong>Egresos Semestrales:</strong> $${dictamen.egresos.toLocaleString()}</p>
                        <hr>
                        <p class="instruccion-final">Acción: El cliente es candidato. Procede a comunicarlo y generar el esquema de pagos.</p>
                    `;
                } else {
                    resultado.innerHTML = `
                        <h3>⚠️ Riesgo Alto - Crédito Rechazado</h3>
                        <p><strong>Nivel de Endeudamiento:</strong> ${dictamen.porcentaje}% (Supera el límite del 70%)</p>
                        <p><strong>Ingresos Semestrales:</strong> $${dictamen.ingresos.toLocaleString()}</p>
                        <p><strong>Egresos Semestrales:</strong> $${dictamen.egresos.toLocaleString()}</p>
                        <hr>
                        <p class="instruccion-final">Acción: Nivel de deuda riesgoso. Notificar declinación por políticas del banco.</p>
                    `;
                }
                
                dropText.innerHTML = `📁 Soltar nuevos estados de cuenta...`;
            }, 1500);
        });
    </script>

    <script type='text/javascript'>
        function initEmbeddedMessaging() {
            try {
                embeddedservice_bootstrap.settings.language = 'es_MX'; // Corregido a es_MX

                embeddedservice_bootstrap.init(
                    '00Dg500000B7Kev',
                    'Chat_GitHub_PWA',
                    'https://orgfarm-b25ce7f3aa-dev-ed.develop.my.site.com/ESWChatGitHubPWA1780352056423',
                    {
                        scrt2URL: 'https://orgfarm-b25ce7f3aa-dev-ed.develop.my.salesforce-scrt.com'
                    }
                );
            } catch (err) {
                console.error('Error loading Embedded Messaging: ', err);
            }
        };
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('✅ Service Worker registrado', reg))
                    .catch(err => console.log('⚠️ Error en Service Worker', err));
            });
        }
    </script>

</body>
</html>
